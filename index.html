<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-FIT | 近未来トレーニング</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>NEO-FIT</h1>
            <p>SYSTEM ACTIVE // CYBER FIT</p>
        </header>

        <!-- メイン画面 -->
        <div id="main-content">
            <!-- レベル選択エリア -->
            <section class="card level-selector">
                <h2>SELECT LEVEL</h2>
                <div class="level-layout">
                    <button class="lvl-btn full-btn" onclick="showLevelGuide('BEGINNER')">
                        BEGINNER <span class="sub-txt">(初心者)</span>
                    </button>
                    <div class="level-row">
                        <button class="lvl-btn" onclick="showLevelGuide('INTERMEDIATE')">
                            INTERMEDIATE <span class="sub-txt">(中級者)</span>
                        </button>
                        <button class="lvl-btn" onclick="showLevelGuide('ADVANCED')">
                            ADVANCED <span class="sub-txt">(上級者)</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- タイマー機能エリア -->
            <section class="card timer-section">
                <h2>INTERVAL TIMER</h2>
                <div id="timer-display">00:60</div>
                <div class="timer-controls">
                    <button onclick="startTimer(60)">60秒</button>
                    <button onclick="startTimer(90)">90秒</button>
                    <button onclick="resetTimer()">リセット</button>
                </div>
            </section>

            <!-- トレーニング記録入力エリア -->
            <section class="card record-section">
                <h2>WORKOUT LOG</h2>
                <form id="workout-form" onsubmit="saveWorkout(event)">
                    <div class="form-group">
                        <label>部位:</label>
                        <div class="select-wrapper">
                            <select id="part-select">
                                <option value="胸 (Chest)">胸 (Chest)</option>
                                <option value="背中 (Back)">背中 (Back)</option>
                                <option value="脚 (Legs)">脚 (Legs)</option>
                                <option value="肩 (Shoulder)">肩 (Shoulder)</option>
                                <option value="腕 (Arms)">腕 (Arms)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>種目:</label>
                        <div class="select-wrapper">
                            <select id="exercise-select">
                                <option value="ベンチプレス">ベンチプレス</option>
                                <option value="スクワット">スクワット</option>
                                <option value="デッドリフト">デッドリフト</option>
                                <option value="ショルダープレス">ショルダープレス</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>重量 (kg): [ <span id="weight-val">50</span> kg ]</label>
                            <input type="range" id="weight-slider" min="10" max="150" step="5" value="50" oninput="document.getElementById('weight-val').innerText=this.value">
                        </div>
                        <div class="form-group">
                            <label>回数 (Rep): [ <span id="rep-val">10</span> reps ]</label>
                            <input type="range" id="rep-slider" min="1" max="30" step="1" value="10" oninput="document.getElementById('rep-val').innerText=this.value">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>備考メモ:</label>
                        <input type="text" id="memo-input" placeholder="例: フォーム意識、調子良いなど">
                    </div>
                    <button type="submit" class="action-btn">記録を保存する</button>
                </form>
            </section>

            <!-- グラフデータ表示エリア -->
            <section class="card chart-section">
                <h2>PROGRESS ANALYTICS</h2>
                <div class="chart-container">
                    <canvas id="progressChart"></canvas>
                </div>
            </section>
        </div>

        <!-- レベル別パーソナル診断・ガイド画面 -->
        <section id="guide-section" class="card" style="display:none;">
            <h2 id="guide-title">LEVEL GUIDE</h2>
            
            <!-- 身体データ入力フォーム -->
            <div class="card" style="background: rgba(0,0,0,0.3); border-color: #38bdf8;">
                <h3 style="color:#38bdf8; font-size:0.85rem; margin-bottom:10px;">// 身体データ・個体差入力</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>性別:</label>
                        <div class="select-wrapper">
                            <select id="user-gender" onchange="calculatePersonalMenu()">
                                <option value="male">男性</option>
                                <option value="female">女性</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>年齢:</label>
                        <input type="number" id="user-age" value="25" min="10" max="100" oninput="calculatePersonalMenu()">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>身長 (cm):</label>
                        <input type="number" id="user-height" value="170" min="100" max="220" oninput="calculatePersonalMenu()">
                    </div>
                    <div class="form-group">
                        <label>体重 (kg):</label>
                        <input type="number" id="user-weight" value="65" min="30" max="200" oninput="calculatePersonalMenu()">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>血圧 (例: 120/80):</label>
                        <input type="text" id="user-bp" value="120/80" oninput="calculatePersonalMenu()">
                    </div>
                    <div class="form-group" id="max-weight-group">
                        <label>最高記録 (kg):</label>
                        <input type="number" id="user-max-weight" value="60" min="0" max="250" oninput="calculatePersonalMenu()">
                    </div>
                </div>
            </div>

            <!-- 分析結果・メニュー・画像・プロテイン提案表示エリア -->
            <div id="guide-content">
                <!-- JSで動的生成 -->
            </div>
            
            <button onclick="hideGuide()" class="action-btn" style="margin-top:15px;">ホームに戻る</button>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
